version: 2
updates:
  # npm audit flagged vulnerabilities during the Docker build (see
  # Dockerfile) -- this is the ongoing mechanism instead of a one-time
  # manual fix, so dependency CVEs surface as PRs automatically.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright*'
    ignore:
      # typescript-eslint@8.65.0 requires typescript@>=4.8.4 <6.1.0 as a
      # peer dependency -- confirmed live that a major bump (5.x -> 7.x)
      # breaks `npm ci` outright. TypeScript is intentionally pinned to
      # ~5.7.0 for this reason; only ignoring major bumps so patch/minor
      # updates within the <6.1.0 ceiling still come through normally.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Keeps actions/checkout, actions/setup-node, etc. (see e2e.yml) pinned
  # versions from silently drifting out of date -- the same reasoning as
  # npm deps, just a different ecosystem.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Dockerfile pins mcr.microsoft.com/playwright:v1.62.0-noble explicitly
  # (must match the @playwright/test npm version -- see the Dockerfile
  # comment) -- Dependabot flags when it drifts instead of it going stale
  # silently.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
