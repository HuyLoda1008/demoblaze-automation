name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Required check for PRs: typecheck + ESLint (including the repo-specific
  # rule that blocks tests from calling page.click/fill/... directly instead
  # of going through a page object -- see eslint.config.js) + Prettier
  # format check + unit tests (tests/unit -- pure logic, no browser needed,
  # so they run here instead of waiting on the smoke job's browser install).
  # Whole job runs in seconds, not minutes. This is what makes
  # CODE_CONVENTIONS.md an enforced gate rather than a checklist nobody
  # actually verifies -- see the PR template.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  # Required check for PRs: fast (~40s), tagged @smoke, one happy-path per
  # feature area. This is the job name to mark as a required status check
  # in GitHub branch protection (Settings > Branches > Branch protection
  # rules > Require status checks to pass > "smoke").
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test --grep @smoke
        env:
          BASE_URL: https://www.demoblaze.com
          API_BASE_URL: https://api.demoblaze.com
          TEST_USER: ${{ secrets.DEMOBLAZE_TEST_USER }}
          TEST_PASSWORD: ${{ secrets.DEMOBLAZE_TEST_PASSWORD }}

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: reports/
          retention-days: 14

  # Full cross-browser + regression + api + perf matrix. Not required for
  # PR merge (too slow to gate every push on) -- runs on manual dispatch, or
  # automatically after smoke passes on a push to main. Sharded across 3
  # parallel jobs (--shard=N/3) since this is the one job running the
  # entire cross-browser matrix -- each shard uploads a `blob` report
  # (not html/json/junit directly; blob is the format merge-reports
  # consumes), merged back into a single report by merge-reports below.
  full-suite:
    name: full-suite (shard ${{ matrix.shard }}/3)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          BASE_URL: https://www.demoblaze.com
          API_BASE_URL: https://api.demoblaze.com
          TEST_USER: ${{ secrets.DEMOBLAZE_TEST_USER }}
          TEST_PASSWORD: ${{ secrets.DEMOBLAZE_TEST_PASSWORD }}

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

  # Merges the 3 shards' blob reports into the single html/json/junit
  # report the rest of the pipeline expects (e.g. publish-report). Verified
  # live that `--reporter=html` on this command OVERRIDES the config's
  # reporter list entirely, including the html reporter's `outputFolder`
  # option -- it silently writes to the default `playwright-report/`
  # instead of `reports/html`. Omitting `--reporter` and passing only
  # `--config` is what makes merge-reports actually use the full reporter
  # list (list/html/json/junit) from playwright.config.ts, output paths
  # included.
  merge-reports:
    name: merge-reports
    # `always()` alone isn't enough -- verified live on a PR run that
    # full-suite's own `if:` condition means it's SKIPPED (not failed) on
    # every pull_request event, but `needs: full-suite` + `always()` still
    # let this job attempt to run anyway, downloading blob-report-*
    # artifacts that were never uploaded and failing at that step. Repeats
    # full-suite's exact gate here so this only runs when full-suite
    # actually ran (pass OR fail -- always() still matters for that case).
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - run: npx playwright merge-reports --config=playwright.config.ts all-blob-reports

      - name: Upload full suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: reports/
          retention-days: 14

  # Publishes the full-suite HTML report to GitHub Pages so a reviewer can
  # click into pass/fail detail (trace viewer, screenshots) without
  # downloading a zip -- only for pushes to main (never on a PR, and
  # `if: always()` so a failing run still publishes its report instead of
  # leaving the live page on a stale passing one). Depends on
  # merge-reports, not full-suite directly -- full-suite is now sharded
  # and only produces per-shard blob-report-N artifacts; merge-reports is
  # what actually produces the playwright-report-full artifact this job
  # downloads (caught this before it shipped broken, reconciling this PR
  # with the sharding PR that merged in the meantime).
  publish-report:
    name: publish-report
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: merge-reports
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report-full
          path: reports-full

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports-full/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Builds and pushes the test-runner image (Dockerfile) to GitHub
  # Container Registry -- ghcr.io, tied to this repo via GITHUB_TOKEN, no
  # separate registry account needed. Gated on smoke passing first (only
  # publish an image that at least smoke-tested clean) and push-to-main
  # only, matching full-suite's trigger scope. See k8s/ for what consumes
  # this image (currently references `demoblaze-automation:local`, built
  # locally for the verified kind-cluster workflow in the README -- a real
  # cluster would instead reference ghcr.io/<owner>/demoblaze-automation).
  publish-image:
    name: publish-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
