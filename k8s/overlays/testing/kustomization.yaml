apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demoblaze-testing
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      kind: CronJob
      name: demoblaze-tests
    patch: |-
      - op: replace
        path: /spec/schedule
        value: '*/15 * * * *'
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/args
        value: ['--grep', '@smoke']
